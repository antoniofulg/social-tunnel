// Re-pin and restart the protected social-tunnel services when Chrome or OpenSSH was upgraded.
DPkg::Post-Invoke { "if [ -x /usr/local/sbin/st-domains-reprovision ]; then /usr/local/sbin/st-domains-reprovision --if-changed || echo 'social-tunnel-domains: re-provision failed; run st-domains-reprovision' >&2; fi"; };
