[package]
name = "social-tunnel-app"
version = "0.0.0"
description = "Menu bar app for social-tunnel"
edition = "2021"
publish = false

[lib]
name = "social_tunnel_app_lib"
crate-type = ["rlib"]

[[bin]]
name = "social-tunnel-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
png = "0.17"
