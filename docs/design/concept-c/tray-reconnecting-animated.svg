<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 18 18" class="cC">
  <title>social-tunnel reconnecting (animated preview)</title>
  <style>.tray{color:#000}@media (prefers-color-scheme:dark){.tray{color:#fff}} g.tray{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}  .tray{display:inline-block;width:18px;height:18px;flex:none;vertical-align:middle} .tray svg{display:block;width:100%;height:100%;overflow:visible;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round} /* A · Portal: fill, drain, sweep */ .cA .tray .a-fill{fill:currentColor;stroke:none;transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);opacity:0;transition:transform .3s cubic-bezier(.3,.7,.2,1),opacity .18s} .cA .tray[data-state=connected] .a-fill{transform:none;opacity:1;transition-delay:.16s} .cA .tray .a-slash,.cA .tray .a-cut{stroke-dasharray:100 200;stroke-dashoffset:105;transition:stroke-dashoffset .32s cubic-bezier(.3,.7,.2,1)} .cA .tray[data-state=lost] .a-slash,.cA .tray[data-state=lost] .a-cut{stroke-dashoffset:0;transition-delay:.14s} .cA .tray .a-arch{transition:opacity .25s} .cA .tray .a-sweep{opacity:0;stroke-dasharray:24 200;stroke-dashoffset:24} .cA .tray[data-state=reconnecting] .a-arch{opacity:.3} .cA .tray[data-state=reconnecting] .a-sweep{opacity:1;animation:a-sweep 1.5s cubic-bezier(.5,0,.5,1) infinite} @keyframes a-sweep{from{stroke-dashoffset:24}to{stroke-dashoffset:-100}} .cA .tray .a-bang{opacity:0;transform:translateY(-2.5px);transition:opacity .2s,transform .3s cubic-bezier(.3,1.4,.5,1)} .cA .tray .a-bang circle{fill:currentColor;stroke:none} .cA .tray[data-state=blocked] .a-bang{opacity:1;transform:none;transition-delay:.12s} .cA .tray[data-state=lost] svg{animation:a-blink .5s ease-in-out .55s 1} .cA .tray[data-state=blocked] svg{animation:a-blink2 .5s ease-in-out .5s 1} @keyframes a-blink{50%{opacity:.3}} @keyframes a-blink2{50%{opacity:.3}} /* B · Route: draw, retract, dot progression */ .cB .tray .b-start,.cB .tray .b-end,.cB .tray .b-d{fill:currentColor;stroke:none} .cB .tray .b-path{stroke-dasharray:0 300;transition:stroke-dasharray .38s cubic-bezier(.3,.7,.2,1)} .cB .tray[data-state=connected] .b-path,.cB .tray[data-state=blocked] .b-path{stroke-dasharray:100 300} .cB .tray[data-state=lost] .b-path{stroke-dasharray:46 300} .cB .tray .b-end{transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.5,.5,1)} .cB .tray[data-state=connected] .b-end{transform:none;transition-delay:.3s} .cB .tray .b-ring{stroke-width:1.5;opacity:0;transition:opacity .2s} .cB .tray[data-state=reconnecting] .b-ring,.cB .tray[data-state=idle] .b-ring{opacity:1;transition-delay:.2s} .cB .tray .b-x{stroke-dasharray:10 20;stroke-dashoffset:10.6;transition:stroke-dashoffset .2s ease-out} .cB .tray[data-state=lost] .b-x{stroke-dashoffset:0;transition-delay:.3s} .cB .tray[data-state=lost] .b-x2{transition-delay:.42s} .cB .tray .b-wall{stroke-width:2.3;transform-box:fill-box;transform-origin:center;transform:scaleY(0);opacity:0;transition:transform .26s cubic-bezier(.3,1.5,.5,1),opacity .1s} .cB .tray[data-state=blocked] .b-wall{transform:none;opacity:1;transition-delay:.3s} .cB .tray .b-d{opacity:0;transition:opacity .2s} .cB .tray[data-state=reconnecting] .b-d{opacity:.28;animation:b-dot 1.26s ease-in-out infinite} .cB .tray[data-state=reconnecting] .b-d2{animation-delay:.2s} .cB .tray[data-state=reconnecting] .b-d3{animation-delay:.4s} @keyframes b-dot{0%,60%,100%{opacity:.28}20%{opacity:1}} /* C · Beacon: pulse, spin, ripple */ .cC .tray .c-ring{stroke-dasharray:25 0;stroke-dashoffset:7.5;transform-box:fill-box;transform-origin:center;transition:stroke-dasharray .35s ease,opacity .2s} .cC .tray[data-state=lost] .c-ring{stroke-dasharray:15 10} .cC .tray[data-state=reconnecting] .c-ring{stroke-dasharray:70 30;animation:c-spin 1.1s linear infinite} .cC .tray[data-state=blocked] .c-ring{opacity:0} @keyframes c-spin{to{transform:rotate(360deg)}} .cC .tray .c-dot{fill:currentColor;stroke:none;transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .32s cubic-bezier(.3,1.5,.5,1)} .cC .tray[data-state=connected] .c-dot{transform:none;transition-delay:.12s} .cC .tray[data-state=reconnecting] .c-dot{transform:scale(.5);animation:c-beat 1.1s ease-in-out infinite} @keyframes c-beat{0%,100%{transform:scale(.38)}50%{transform:scale(.62)}} .cC .tray .c-disc{fill:currentColor;stroke:none;transform-box:fill-box;transform-origin:center;transform:scale(.3);opacity:0;transition:transform .3s cubic-bezier(.3,1.4,.5,1),opacity .12s} .cC .tray[data-state=blocked] .c-disc{transform:none;opacity:1} .cC .tray .c-ripple{opacity:0;stroke-width:1.2;transform-box:fill-box;transform-origin:center} .cC .tray[data-state=connected] .c-ripple{animation:c-ripple-in .7s ease-out 1} .cC .tray[data-state=lost] .c-ripple{animation:c-ripple-out .7s ease-out 1} @keyframes c-ripple-in{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.46)}} @keyframes c-ripple-out{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.46)}} </style>
  <g class="tray" data-state="reconnecting"><mask id="m152" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18"><rect width="18" height="18" fill="#fff"/><rect x="5.1" y="7.9" width="7.8" height="2.2" rx="1.1" fill="#000"/></mask><circle class="c-ripple" cx="9" cy="9" r="5.6"/><circle class="c-ring" cx="9" cy="9" r="5.6" pathLength="100"/><circle class="c-dot" cx="9" cy="9" r="2.4"/><circle class="c-disc" cx="9" cy="9" r="6.5" mask="url(#m152)"/></g>
</svg>
